<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6d4aff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; img-src 'self' blob: data: https:; script-src 'self'; style-src 'self'; connect-src https://nwsqyuucwzihruszocge.supabase.co https://*.supabase.co; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>AliaSpaces social client</title>
  <link rel="stylesheet" href="./src/ui/app.css">
  <link rel="manifest" href="./social.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body class="live-client">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">A</span>
      <div>
        <p class="product">AliaSpaces</p>
        <p class="mode" id="modeLabel">First-party social client</p>
      </div>
    </div>
    <p id="actorLabel" class="actor">Not signed in</p>
  </header>

  <div id="banner" class="banner" role="status">
    First-party social client over the live AliaSpaces database. This app says signed in only after Auth verifies a session. Automation, billing, and provider tools are not in this client.
  </div>

  <main id="main" class="sheet">
    <section id="panel-discover" class="panel" data-panel="discover"></section>
    <section id="panel-feed" class="panel" data-panel="feed" hidden></section>
    <section id="panel-compose" class="panel" data-panel="compose" hidden></section>
    <section id="panel-safety" class="panel" data-panel="safety" hidden></section>
    <section id="panel-you" class="panel" data-panel="you" hidden></section>
  </main>

  <nav class="tabs" aria-label="Primary">
    <button type="button" data-nav="discover" class="tab is-active">Discover</button>
    <button type="button" data-nav="feed" class="tab">Feed</button>
    <button type="button" data-nav="compose" class="tab">Post</button>
    <button type="button" data-nav="safety" class="tab">Safety</button>
    <button type="button" data-nav="you" class="tab">You</button>
  </nav>

  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  <script src="./src/live/contract.js"></script>
  <script src="./src/live/social-client.js"></script>
  <script src="./src/live/live-app.js"></script>
  <script src="./src/live/register-pwa.js"></script>
</body>
</html>
