        <p class="product">AliaSpaces</p>
        <p class="mode">Public persona lookup</p>

      <h1>Look up a published handle</h1>
      <label>Handle
        <input name="handle" maxlength="48" required placeholder="persona_handle">
      </label>
      <button class="btn" type="submit">Look up</button>
    </form>
    <section id="result" class="list"></section>
