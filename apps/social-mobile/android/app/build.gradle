plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def keystoreFile = file("../debug.keystore")

android {
    namespace "com.aliaspaces.social.local"
    compileSdk 34

    defaultConfig {
        applicationId "com.aliaspaces.social.local"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.5.0-pwa"
    }

    signingConfigs {
        localDebug {
            storeFile keystoreFile
            storePassword "android"
            keyAlias "aliaspaceslocal"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.localDebug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.localDebug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.browser:browser:1.8.0"
}

tasks.register("copyWebAssets", Copy) {
    from("${rootProject.projectDir}/..") {
        include "index.html"
        include "live.html"
        include "hub.html"
        include "persona.html"
        include "error.html"
        include "hub.webmanifest"
        include "social.webmanifest"
        include "persona.webmanifest"
        include "local.webmanifest"
        include "sw.js"
        include "mark.svg"
        include "icons/**"
        include "src/**"
    }
    into("${projectDir}/src/main/assets/www")
}

tasks.named("preBuild").configure {
    dependsOn("copyWebAssets")
}
